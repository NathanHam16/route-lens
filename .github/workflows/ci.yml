name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use npm 11 (lockfile parity with local dev)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: |
          if node -p "Boolean(require('./package.json').scripts?.typecheck)" | grep -q true; then
            npm run typecheck
          else
            npx tsc --noEmit
          fi

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build

      - name: Pack dry run
        run: npm pack --dry-run
