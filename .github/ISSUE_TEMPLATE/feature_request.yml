name: Feature Request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels:
  - enhancement
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Share an idea for route-lens. Focus on the problem and the outcome you want.

  - type: textarea
    id: problem
    attributes:
      label: Problem or gap
      description: What is hard, missing, or confusing today?
      placeholder: |
        When auditing a large App Router tree, I cannot easily see which shared components are imported by multiple routes.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: How should route-lens behave? CLI flag, widget UI, API option, etc.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, or workarounds you use today.
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Which surfaces would this touch?
      options:
        - label: CLI (`route-lens` bin)
        - label: React widget (`@nathanham16/route-lens/react`)
        - label: Next.js handler (`@nathanham16/route-lens/next`)
        - label: Core import graph / colocation rules
        - label: Documentation only
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Example routes, screenshots, or links to similar tools.
    validations:
      required: false
